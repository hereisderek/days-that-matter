name: Share Service

# Cloudflare Worker + D1 in services/share/. Independent from the app pipelines.
# Contract: docs/architecture/SHARE_SERVICE.md section 10.3. Pipeline docs: docs/ci-cd/WORKFLOW_PIPELINE.md section 4.
on:
  pull_request:
    paths:
      - 'services/share/**'
      - '.github/workflows/share-service.yml'
  push:
    branches: [master]
    paths:
      - 'services/share/**'
      - '.github/workflows/share-service.yml'
    tags:
      - 'share-v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: services/share

jobs:
  verify:
    name: Typecheck, lint, test, dry-run deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/share/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Placeholder check (JSON validity of the association files). Token drift check is added by the web implementer.
      - run: npm run check:assets
      # Production dependencies only: the dev toolchain (miniflare/undici) never ships in the Worker bundle.
      - run: npm audit --omit=dev --audit-level=high
      # Builds both environments without credentials and without uploading.
      - run: npm run deploy:dry-run

  deploy-preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    concurrency:
      group: share-service-preview
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/share/package-lock.json
      - run: npm ci
      - name: Refuse placeholder D1 id
        run: node scripts/check-placeholders.mjs --deploy preview
      # Migrations first. They must be backward compatible with the Worker version that is still live.
      - name: Apply D1 migrations (preview)
        run: npm run migrate:preview
      - name: Deploy Worker (preview)
        run: npm run deploy:preview
      - name: Smoke test (preview)
        env:
          BASE_URL: ${{ vars.SHARE_PREVIEW_URL }}
        run: npm run smoke

  deploy-production:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/share-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment in GitHub settings.
    environment: production
    concurrency:
      group: share-service-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A tag on a side branch must not reach production: the tagged commit has to be on master.
      - name: Require tagged commit on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/share/package-lock.json
      - run: npm ci
      - name: Strict placeholder check (association files and D1 id)
        run: |
          npm run check:assets:strict
          node scripts/check-placeholders.mjs --deploy production
      - name: Apply D1 migrations (production)
        run: npm run migrate:prod
      - name: Deploy Worker (production)
        run: npm run deploy:prod
      - name: Smoke test (production)
        env:
          BASE_URL: ${{ vars.SHARE_PRODUCTION_URL || 'https://daysthatmatter.app' }}
        run: npm run smoke
