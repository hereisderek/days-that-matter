# Gradle
# Sized for small hosts: the agent container has 8 GB RAM shared with other tools, and earlier runs with
# a 4 GB Gradle heap plus a 3 GB Kotlin daemon were killed by the OOM killer. Keep the build in one JVM
# (Kotlin compiles in-process below) with at most two workers. CI runners have more memory but use the
# same values so local and CI builds behave alike.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon instead of a separate Kotlin daemon (see the memory note above).
kotlin.compiler.execution.strategy=in-process
# Apple targets are declared in every multiplatform module but only build on macOS.
# On Linux and Windows hosts Kotlin skips them; this silences the warning.
kotlin.native.ignoreDisabledTargets=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Never install SDK components during a build. Missing platforms or build tools fail the
# build instead, so they are installed on purpose (see docs/ci-cd/TOOLCHAIN_GUIDELINES.md).
android.builder.sdkDownload=false
