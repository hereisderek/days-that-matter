name: Share Service

# Frozen TypeScript share service in services/share/ (superseded by the backend in the OpenSpec change
# pluggable-backend-live-sharing). It is never deployed, so only the checks remain; this workflow and the
# service are deleted by task 5.5 of that change. Pipeline docs: docs/ci-cd/WORKFLOW_PIPELINE.md section 4.
on:
  pull_request:
    paths:
      - 'services/share/**'
      - '.github/workflows/share-service.yml'
  push:
    branches: [master]
    paths:
      - 'services/share/**'
      - '.github/workflows/share-service.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: services/share

jobs:
  verify:
    name: Typecheck, lint, test, dry-run deploy (frozen service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/share/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Placeholder check (JSON validity of the association files). Token drift check is added by the web implementer.
      - run: npm run check:assets
      # Production dependencies only: the dev toolchain (miniflare/undici) never ships in the Worker bundle.
      - run: npm audit --omit=dev --audit-level=high
      # Builds both environments without credentials and without uploading.
      - run: npm run deploy:dry-run
