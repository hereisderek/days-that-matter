<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days That Matter · Shared Web View (Design v2)</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0A0D0C;
      --surface: #141816;
      --surface-raised: #1C2220;
      --border: rgba(236, 241, 238, 0.1);
      --border-focus: #52D6A3;
      --text: #ECF1EE;
      --text-muted: #95A29D;
      --accent: #52D6A3;
      --accent-dim: rgba(82, 214, 163, 0.15);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.5;
      overflow: hidden;
    }
    .app-layout {
      display: flex; height: 100vh; width: 100vw;
    }

    /* Sidebar controls */
    .sidebar {
      width: 360px; min-width: 320px; height: 100%;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 10;
    }
    .sidebar-header {
      padding: 24px 20px 16px; border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .brand-icon {
      width: 28px; height: 28px; border-radius: 8px;
    }
    .brand-title {
      font-size: 17px; font-weight: 700; letter-spacing: -0.02em; margin: 0;
      color: var(--text);
    }
    .sidebar-desc {
      margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.4;
    }

    /* Device mode switcher */
    .device-switcher {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; gap: 8px; background: rgba(0,0,0,0.2);
    }
    .tab-btn {
      flex: 1; padding: 7px 10px; font-size: 12px; font-weight: 600;
      background: var(--surface-raised); border: 1px solid var(--border);
      color: var(--text-muted); border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
    .tab-btn.active {
      background: var(--accent-dim); color: var(--accent);
      border-color: var(--accent);
    }

    /* Sample list */
    .sample-list {
      flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;
    }
    .sample-item {
      padding: 12px 14px; border-radius: 12px;
      background: var(--surface-raised); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.18s ease; text-align: left;
    }
    .sample-item:hover {
      border-color: rgba(255,255,255,0.25); transform: translateY(-1px);
    }
    .sample-item.active {
      border-color: var(--accent); background: rgba(82, 214, 163, 0.08);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .sample-title-row {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
    }
    .sample-title {
      font-weight: 600; font-size: 14px; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    .sample-desc {
      font-size: 12px; color: var(--text-muted); line-height: 1.4; margin: 0 0 8px;
    }
    .sample-tags {
      display: flex; flex-wrap: wrap; gap: 4px;
    }
    .tag {
      font-size: 11px; padding: 2px 7px; border-radius: 99px;
      background: rgba(255,255,255,0.06); color: #B3C0BB;
    }
    .tag.highlight {
      background: var(--accent-dim); color: var(--accent);
    }

    /* Main preview viewport */
    .preview-stage {
      flex: 1; height: 100%; background: #050706;
      display: flex; flex-direction: column; position: relative;
    }
    .preview-bar {
      height: 48px; border-bottom: 1px solid var(--border); background: var(--surface);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
    }
    .preview-info {
      font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 12px;
    }
    .url-badge {
      background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #78E2BD;
    }
    .preview-actions {
      display: flex; gap: 10px;
    }
    .action-btn {
      background: var(--surface-raised); border: 1px solid var(--border);
      color: var(--text); padding: 5px 12px; border-radius: 6px;
      font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .action-btn:hover { border-color: rgba(255,255,255,0.3); }

    .viewport-canvas {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: auto; padding: 24px; position: relative;
    }

    /* Phone frame simulation */
    .device-frame {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .device-frame.phone {
      width: 390px; height: 844px; max-height: 90vh;
      border: 12px solid #222927; border-radius: 54px;
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      overflow: hidden; background: #0A0D0C; position: relative;
    }
    .device-frame.tablet {
      width: 768px; height: 960px; max-height: 90vh;
      border: 14px solid #222927; border-radius: 36px;
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      overflow: hidden; background: #0A0D0C; position: relative;
    }
    .device-frame.desktop {
      width: 100%; height: 100%; border: none; border-radius: 0;
      box-shadow: none; background: #0A0D0C;
    }
    .preview-frame {
      width: 100%; height: 100%; border: none; display: block;
      background: #0A0D0C;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-icon" src="assets/icon.svg" alt="Days That Matter">
          <h1 class="brand-title">Days That Matter</h1>
        </div>
        <p class="sidebar-desc">Shared Web View interactive design demo. Demonstrates the floating frosted card, fluid responsive viewport, animations, media backdrops, and music playback.</p>
      </div>

      <!-- Mode switcher -->
      <div class="device-switcher">
        <button class="tab-btn active" data-mode="phone">📱 Phone (390×844)</button>
        <button class="tab-btn" data-mode="tablet">💻 Tablet</button>
        <button class="tab-btn" data-mode="desktop">🖥 Desktop</button>
      </div>

      <!-- Samples list -->
      <div class="sample-list" id="sample-list"></div>
    </aside>

    <!-- Main Preview -->
    <main class="preview-stage">
      <header class="preview-bar">
        <div class="preview-info">
          <span id="active-title" style="font-weight: 600; color: var(--text);">Our Wedding Day</span>
          <span class="url-badge" id="active-url">pages/wedding.html</span>
        </div>
        <div class="preview-actions">
          <a class="action-btn" id="open-new-tab" href="pages/wedding.html" target="_blank" rel="noopener">
            ↗ Open in new tab
          </a>
        </div>
      </header>
      <div class="viewport-canvas">
        <div class="device-frame phone" id="frame-container">
          <iframe class="preview-frame" id="content-frame" src="pages/wedding.html" title="Days That Matter Preview"></iframe>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SAMPLES = [
      {
        id: "wedding",
        file: "wedding.html",
        emoji: "💍",
        title: "Our Wedding Day",
        desc: "Glassmorphic frosted card with soft blur/dim photo backdrop, rose palette, Modern Sans, and audio visualizer pill.",
        tags: ["Photo Backdrop", "Audio Player", "Glassmorphic", "Modern Sans", "Rose"]
      },
      {
        id: "aurora",
        file: "aurora.html",
        emoji: "🌌",
        title: "Northern Lights Expedition",
        desc: "Full-bleed poster with animated motion photo video loop, cyan/emerald glow, and live countdown ticker.",
        tags: ["Animated Video", "Full-Bleed Poster", "Live Ticker", "Emerald"]
      },
      {
        id: "anniversary",
        file: "anniversary.html",
        emoji: "🥂",
        title: "Years Together",
        desc: "Milestone count-up since marriage with anniversary badge, Classic Serif, and warm amber glow.",
        tags: ["Milestone Count-Up", "Anniversary", "Classic Serif", "Amber"]
      },
      {
        id: "launch",
        file: "launch.html",
        emoji: "🚀",
        title: "Days That Matter v1.0 Launch",
        desc: "Minimalist clean style with Monospace Tech font, blue palette, and Workdays unit calculation.",
        tags: ["Workdays", "Minimalist Clean", "Monospace Tech", "Blue"]
      },
      {
        id: "concert",
        file: "concert.html",
        emoji: "🎵",
        title: "Live in Concert",
        desc: "Concert countdown featuring 'Listen on Spotify' deep link pill, Playful Rounded typography, and violet theme.",
        tags: ["Spotify Link", "Playful Rounded", "Violet"]
      },
      {
        id: "today",
        file: "today.html",
        emoji: "🎓",
        title: "Graduation Day",
        desc: "Hero 'Today is the day' presentation with celebration state and dynamic layout.",
        tags: ["Today State", "Minimalist", "Ink"]
      },
      {
        id: "kyoto",
        file: "kyoto.html",
        emoji: "🍁",
        title: "Kyoto in Autumn",
        desc: "Multi-stop linear gradient backdrop with soft plum aura and editorial condensed typography.",
        tags: ["Gradient", "Editorial Condensed", "Plum"]
      },
      {
        id: "marathon",
        file: "marathon.html",
        emoji: "🏃",
        title: "Sunday Long Run",
        desc: "Card outlined style with high-contrast borders and weeks & days mode.",
        tags: ["Card Outlined", "Weeks & Days", "Coral"]
      },
      {
        id: "tomorrow",
        file: "tomorrow.html",
        emoji: "✈️",
        title: "Flight Departs",
        desc: "Hours countdown for imminent event with live seconds ticker.",
        tags: ["Hours Mode", "Sky Palette", "Live Ticker"]
      },
      {
        id: "since",
        file: "since.html",
        emoji: "🏡",
        title: "Days Since Moving In",
        desc: "Count-up since past milestone with calm minimalist presentation.",
        tags: ["Count-up", "Sleeps", "Glassmorphic"]
      },
      {
        id: "invite",
        file: "invite.html",
        emoji: "📨",
        title: "Invite Landing (/i/token)",
        desc: "Generic invite landing page with byte-identical security and 'Open in App' CTA.",
        tags: ["Invite Page", "App Deep Link"]
      },
      {
        id: "member",
        file: "member.html",
        emoji: "👥",
        title: "Member Landing (/s/id)",
        desc: "Generic member access landing page prompting member to open app.",
        tags: ["Member Landing", "App Deep Link"]
      },
      {
        id: "expired",
        file: "expired.html",
        emoji: "🚫",
        title: "Link Gone (410)",
        desc: "Graceful expired or revoked link error card matching app design language.",
        tags: ["410 Gone", "Error Card"]
      },
      {
        id: "not-found",
        file: "not-found.html",
        emoji: "❓",
        title: "Link Not Found (404)",
        desc: "Unknown link state providing safe navigation back to product home.",
        tags: ["404 Not Found", "Error Card"]
      }
    ];

    let currentSample = SAMPLES[0];
    let currentMode = "phone";

    const listEl = document.getElementById("sample-list");
    const frameContainer = document.getElementById("frame-container");
    const contentFrame = document.getElementById("content-frame");
    const activeTitle = document.getElementById("active-title");
    const activeUrl = document.getElementById("active-url");
    const openNewTab = document.getElementById("open-new-tab");

    function renderList() {
      listEl.innerHTML = "";
      SAMPLES.forEach(s => {
        const item = document.createElement("div");
        item.className = "sample-item" + (s.id === currentSample.id ? " active" : "");
        item.innerHTML = `
          <div class="sample-title-row">
            <span class="sample-title"><span>${s.emoji}</span> ${s.title}</span>
          </div>
          <p class="sample-desc">${s.desc}</p>
          <div class="sample-tags">
            ${s.tags.map((t, idx) => `<span class="tag ${idx === 0 ? 'highlight' : ''}">${t}</span>`).join("")}
          </div>
        `;
        item.addEventListener("click", () => selectSample(s));
        listEl.appendChild(item);
      });
    }

    function selectSample(s) {
      currentSample = s;
      renderList();
      const pageUrl = `pages/${s.file}`;
      contentFrame.src = pageUrl;
      activeTitle.textContent = `${s.emoji} ${s.title}`;
      activeUrl.textContent = pageUrl;
      openNewTab.href = pageUrl;
    }

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        frameContainer.className = "device-frame " + currentMode;
      });
    });

    renderList();
  </script>
</body>
</html>
